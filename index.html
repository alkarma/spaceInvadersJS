<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Space Invaders JS</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="space-wrap">
		<canvas id="field"></canvas>
		<div id="hud"></div>
	</div>

	<div id="start_menu">
		<div class="login_wrapper">
			<div class="button nickname_submit">Login</div>
			<input id="nickname" type="text" autocomplete="off">
			<div class="button logout">Logout</div>
		</div>
		<div class="greeting-text">
			<p class="text"></p>
		</div>
		<div class="button play">
			<span>Play game</span>
		</div>
		<div class="button options">
			<span>Options</span>
		</div>
	</div>

	<div id="select_control">
		<p>Select your control type</p>
		<div class="button back"><span>Back to Main menu</span></div>
		<div class="button keyboard"><span>Keyboard<br>+<br>Mouse</span></div>
		<div class="button mouse"><span>Mouse</span></div>
	</div>

	<div id="pause_screen">
		<p class="pause_inscription">PAUSED</p>
		<p class="pause_notice">press ESC to continue</p>
	</div>

	<div class="gameover">
		<p class="gameover_inscription fail">GAME OVER!</p>
		<p class="gameover_inscription win">CONGRATULATIONS!!!</p>
		<p class="yourscore"></p>
		<p class="gameover_notice fail">You suck!</p>
		<p class="gameover_notice win">You win this game! <br> <br> <br> You scored 100 points in this game ... Seriously? Don't you have a personal life?</p>
		<div class="button back">back to main menu</div>
	</div>

	<script type="module" src="src/main.js"></script>
</body>
</html>
